services:
  questdb:
    image: docker.io/questdb/questdb:10.0.1
    ports:
      - "19000:9000"
      - "19009:9009"
      - "19003:9003"
      - "18812:8812"
    volumes:
      - questdb-data:/var/lib/questdb

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.7.2
    depends_on:
      - questdb
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Europe/Paris
    ports:
      - "18123:8123"
    volumes:
      - ./dev/homeassistant:/config
      - ./custom_components/hass_questdb_writer:/config/custom_components/hass_questdb_writer:ro

  grafana:
    image: docker.io/grafana/grafana:12.4.9
    depends_on:
      - questdb
    environment:
      GF_SECURITY_ADMIN_USER: test
      GF_SECURITY_ADMIN_PASSWORD: test
      GF_INSTALL_PLUGINS: questdb-questdb-datasource
      TZ: Europe/Paris
    ports:
      - "13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dev/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  questdb-data:
  grafana-data:
